version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gamestore-ai-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=sqlite:///./data/gamestore.db
      - ENVIRONMENT=development
    volumes:
      # La carpeta ./data local se monta en el contenedor
      # Asi la base de datos es visible desde tu PC (DB Browser, etc.)
      - ./data:/app/data
    command: >
      uvicorn src.infrastructure.api.main:app
      --host 0.0.0.0
      --port 8000
      --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  default:
    name: gamestore-ai-network
    driver: bridge
